name: Ping Supabase

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Keep-Alive Ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # Sanitize environment variables - remove all whitespace
          URL=$(echo "${SUPABASE_URL}" | tr -d '[:space:]')
          KEY=$(echo "${SUPABASE_KEY}" | tr -d '[:space:]')

          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_KEY secret in repository settings."
            exit 1
          fi

          # Query Supabase PostgREST endpoint to keep database active
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}" \
            "${URL}/rest/v1/quiz_sessions?select=id&limit=1")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Supabase database ping successful at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          elif [ "$HTTP_CODE" -eq 503 ]; then
            echo "::error::Supabase project is currently paused (HTTP 503). Please unpause it via the Supabase dashboard."
            exit 1
          else
            echo "::error::Supabase ping failed with HTTP $HTTP_CODE: $BODY"
            exit 1
          fi

